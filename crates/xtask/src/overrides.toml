# ------------------------------------------------------------------------------ one_or_many
#
# `operationId` -> the name of a generated untagged enum that accepts either the declared
# response model or a list of it. See `Overrides::one_or_many`.

[one_or_many]
# `GET /repos/{owner}/{repo}/contents/{filepath}` is declared to answer a single
# `ContentsResponse`, and answers an *array* of them whenever `filepath` names a directory.
# The operation's own summary admits it -- "Gets the metadata and contents (if a file) of an
# entry in a repository, or a list of entries if a dir" -- but its `responses` block does not,
# so the generated method could not express the directory case at all and hard-failed decoding
# with "invalid type: sequence, expected struct ContentsResponse".
#
# An untagged enum rather than something simpler because both shapes genuinely occur on the
# same route and neither is a superset of the other: `Vec<ContentsResponse>` cannot decode a
# file and `ContentsResponse` cannot decode a directory, so any single concrete type is wrong
# half the time. `serde_json::Value` would decode both and give up all typing for a route
# people actually use. The enum decodes both, keeps the element type, and `into_vec()` /
# `as_slice()` let a caller that does not care which arrived ignore the distinction.
repoGetContents = "ContentsResponseOrList"

# ---------------------------------------------------------------------------------------------
# [response_type] — operationId → "bytes" | "empty" | "json", where the declared response is wrong
# ---------------------------------------------------------------------------------------------
#
# "bytes": Gitea declares these as `200` with no schema under a JSON `produces`, which would
# lower to `()` and discard the archive or the log the route actually returns.
#
# "empty": the variable deletes declare `200` with an `ActionVariable` body, and the handler
# answers `204 No Content` (`ctx.Status(http.StatusNoContent)` in routers/api/v1/*/action.go,
# measured against 1.27.3). Decoding the declared type fails on the empty body — after the
# variable is already gone — so every `gea variable delete` reported an error for a success.
[response_type]
repoGetArchive = "bytes"
downloadActionsRunJobLogs = "bytes"
deleteRepoVariable = "empty"
deleteOrgVariable = "empty"
# "json": the four registration-token routes declare the token as a response *header* and no
# body, and the handler answers `{"token": "…"}` (measured against 1.27.3). Lowered to `()`, the
# one thing the route exists to hand out was discarded and `gea raw … create-runner-registration-
# token` printed nothing at all.
adminCreateRunnerRegistrationToken = "json"
orgCreateRunnerRegistrationToken = "json"
repoCreateRunnerRegistrationToken = "json"
userCreateRunnerRegistrationToken = "json"
# `repoGetEditorConfig` declares a `200` with no schema; the handler answers the resolved
# settings as a JSON object (`{"indent_size":"4"}`, measured). Without this `gea raw repo
# get-editor-config` printed nothing.
repoGetEditorConfig = "json"
