# overrides.toml — the only place a human overrules the spec.
#
# Read by `xtask` during IR lowering and by nothing else. See overrides.rs for why emitters
# are forbidden from touching this file.
#
# Adding an entry here is a *naming* decision with user-visible consequences: it changes a
# command in `spec/name-lock.toml`, which is a versioned contract. Renaming an existing entry
# therefore requires `cargo xtask codegen --accept-renames` and shows up in the changelog.

# NOTE ON ORDERING: TOML puts every bare key after a `[table]` header *inside* that table,
# so the two top-level lists have to come before the first section. Moving them below one
# would not error — they would silently become keys of whichever table precedes them.

# ---------------------------------------------------------------------------------------------
# path_like — path parameters that may contain `/`
# ---------------------------------------------------------------------------------------------
#
# `encode::seg` percent-encodes with the path-segment set, which turns `src/main.rs` into
# `src%2Fmain.rs` and produces a 404 that looks like the file does not exist. These parameters
# are documented by Gitea as taking a path or a ref, so their slashes are structural and must
# survive. Everything not listed here is encoded as a single segment — which is what protects
# us from an owner literally named `a/b`.
#
# `filepath` and `ref` appear as path parameters in v1.27.2; `treePath`, `path` and `filename`
# are listed because they appear as parameters elsewhere in the API surface and would have the
# same problem the moment they show up in a path template.
path_like = ["filepath", "treePath", "ref", "path", "filename"]

# ---------------------------------------------------------------------------------------------
# demote_required — fields to treat as optional despite the spec saying required
# ---------------------------------------------------------------------------------------------
#
# Only 39 of 246 definitions declare `required` at all, so the blast radius is small. Spec
# `required` is treated as advisory for deserialization: a server that stops sending a field is
# better handled as a default than as a hard decode failure in the middle of a list command.
#
# `EditUserOption.source_id` is `required` in Gitea's spec, but `PATCH /admin/users/{username}`
# is a partial update and the server accepts a body without it (verified against 1.27.3). As a
# required field it serialises on every request, so a typed edit of the full name alone would
# also send `source_id: 0` — moving the account onto local authentication.
demote_required = ["EditUserOption.source_id"]

# ---------------------------------------------------------------------------------------------
# [op] — operationId → (group, command)
# ---------------------------------------------------------------------------------------------
#
# Gitea's 482 operationIds are camelCase except for 11 that are PascalCase, all of them
# Actions or Git plumbing. Those have no `<group>` prefix word, and the camelCase Actions ones
# (`getWorkflowRuns`, `getArtifacts`, …) have a verb for a first word rather than a group, so
# the mangler would fall back to `tags[0]` — which for all of them is `repository`. That is
# technically correct and practically awful: `gea raw repo get-workflow-runs` instead of
# `gea raw run list`, with the Actions surface scattered through a 202-command group.
#
# `gh` calls these `gh run` and `gh workflow`, and layer 3's porcelain will too, so putting
# layer 2 in the same vocabulary means one mental model instead of two.

[op.getWorkflowRuns]
group = "run"
command = "list"

[op.GetWorkflowRun]
group = "run"
command = "view"
why = "PascalCase with no group word; `view` matches gh"

[op.deleteActionRun]
group = "run"
command = "delete"

[op.listWorkflowRunJobs]
group = "run"
command = "jobs"

[op.getArtifactsOfRun]
group = "run"
command = "artifacts"

[op.rerunWorkflowRun]
group = "run"
command = "rerun"

[op.rerunFailedWorkflowRun]
group = "run"
command = "rerun-failed"

[op.rerunWorkflowJob]
group = "run"
command = "rerun-job"

[op.getWorkflowRunAttempt]
group = "run"
command = "attempt"

[op.listWorkflowRunAttemptJobs]
group = "run"
command = "attempt-jobs"

[op.listWorkflowJobs]
group = "job"
command = "list"

[op.getWorkflowJob]
group = "job"
command = "view"

[op.downloadActionsRunJobLogs]
group = "job"
command = "logs"

[op.getArtifacts]
group = "artifact"
command = "list"

[op.getArtifact]
group = "artifact"
command = "view"

[op.deleteArtifact]
group = "artifact"
command = "delete"

[op.downloadArtifact]
group = "artifact"
command = "download"

[op.ListActionTasks]
group = "task"
command = "list"

[op.ActionsListRepositoryWorkflows]
group = "workflow"
command = "list"

[op.ActionsGetWorkflow]
group = "workflow"
command = "view"

[op.ActionsDispatchWorkflow]
group = "workflow"
command = "dispatch"

[op.ActionsEnableWorkflow]
group = "workflow"
command = "enable"

[op.ActionsDisableWorkflow]
group = "workflow"
command = "disable"

[op.ActionsListWorkflowRuns]
group = "workflow"
command = "runs"

[op.GetBlob]
group = "git"
command = "blob"

[op.GetTree]
group = "git"
command = "tree"

[op.GetAnnotatedTag]
group = "git"
command = "annotated-tag"

[op.userGetOAuth2Application]
group = "user"
command = "get-oauth2-application"
why = "the splitter cannot know OAuth2 is one word; see the note above"

[op.userGetOauth2Application]
group = "user"
command = "list-oauth2-applications"
why = "plural of the getter above; `list` also matches every other collection command"

[op.userCreateOAuth2Application]
group = "user"
command = "create-oauth2-application"

[op.userUpdateOAuth2Application]
group = "user"
command = "update-oauth2-application"

[op.userDeleteOAuth2Application]
group = "user"
command = "delete-oauth2-application"

# ---------------------------------------------------------------------------------------------
# [newtype] — Model.field → ID newtype
# ---------------------------------------------------------------------------------------------
#
# Curated, never automatic. The entries that matter are the ones where Gitea carries both a
# global row id and a per-repository counter on the same object: `Issue.id` is a database id,
# `Issue.number` is what `#42` means, and `/issues/{index}` wants the latter while
# `/issues/comments/{id}` wants the former. Mixing them up does not 404 — it silently operates
# on a different, real issue. That is the most common class of Gitea-API bug, and these entries
# turn it into a compile error.
#
# Extended as the models emitter (M4) lands; an unlisted field is a plain `i64`, which is
# correct, just less safe.
[newtype]
"Issue.id" = "IssueId"
"Issue.number" = "IssueIndex"
"PullRequest.id" = "PullRequestId"
"PullRequest.number" = "IssueIndex"
"Repository.id" = "RepoId"
"User.id" = "UserId"
"Organization.id" = "OrgId"
"Team.id" = "TeamId"
"Comment.id" = "CommentId"
"Label.id" = "LabelId"
"Milestone.id" = "MilestoneId"
"Release.id" = "ReleaseId"
"Attachment.id" = "AttachmentId"
"ActionWorkflowRun.id" = "RunId"
"ActionWorkflowJob.id" = "JobId"
"ActionArtifact.id" = "ArtifactId"
"Hook.id" = "HookId"
"PublicKey.id" = "KeyId"
"DeployKey.id" = "KeyId"
"TrackedTime.id" = "TrackedTimeId"
"PullReview.id" = "ReviewId"

# ---------------------------------------------------------------------------------------------
# [enum_values] — known variants for bare `type: string` definitions
# ---------------------------------------------------------------------------------------------
#
# Six definitions are Go named string types that the swagger generator emitted without their
# values: it knows `StateType` is a string but not that the string is `open` or `closed`. They
# become open enums, and these are their curated `KNOWN` lists.
#
# An incomplete list here is *harmless by construction*: an open enum accepts any value,
# records unknown ones in the compat collector, and round-trips them verbatim. So this table
# buys better completion and better help text, and risks nothing. Do not be tempted to make it
# a closed enum for tidiness.
[enum_values]

# ---------------------------------------------------------------------------------------------
# [enum_name] — Model.field → name for that field's generated open enum
# ---------------------------------------------------------------------------------------------
#
# Default is `<Model><Field>` in PascalCase, which is right for the one-off enums
# (`ActionRunnerStatus`, `ActivityOpType`). These are the cases where the same value set
# appears on several models and one shared type is both smaller and more useful — a permission
# is a permission whether you are adding a collaborator or editing a team.
#
# Gitea inlines every enum where Forgejo's spec named a few of them (`StateType`,
# `CommitStatusState`, `ReviewStateType`), so the Forgejo-era names are restored here: the
# porcelain was written against them and one `StateType` is more useful than five
# `<Model>State` types that all say "open or closed".
[enum_name]
"AddCollaboratorOption.permission" = "PermissionLevel"
"CreateTeamOption.permission" = "PermissionLevel"
"EditTeamOption.permission" = "PermissionLevel"
"CreateOrgOption.visibility" = "VisibilityMode"
"EditOrgOption.visibility" = "VisibilityMode"
"CreateRepoOption.object_format_name" = "ObjectFormatName"
"Repository.object_format_name" = "ObjectFormatName"
"MergePullRequestOption.do" = "MergeStyle"
"CreateTeamOption.visibility" = "VisibilityMode"
"EditTeamOption.visibility" = "VisibilityMode"
"Team.visibility" = "VisibilityMode"
"CreateUserOption.visibility" = "VisibilityMode"
"EditUserOption.visibility" = "VisibilityMode"
"User.visibility" = "VisibilityMode"
"Organization.visibility" = "VisibilityMode"
"Issue.state" = "StateType"
"PullRequest.state" = "StateType"
"Milestone.state" = "StateType"
"CreateMilestoneOption.state" = "StateType"
"EditMilestoneOption.state" = "StateType"
"CombinedStatus.state" = "CommitStatusState"
"CommitStatus.status" = "CommitStatusState"
"CreateStatusOption.state" = "CommitStatusState"
"PullReview.state" = "ReviewStateType"
"CreatePullReviewOptions.event" = "ReviewStateType"
"SubmitPullReviewOptions.event" = "ReviewStateType"
"Team.permission" = "AccessMode"
"RepoCollaboratorPermission.permission" = "AccessMode"

# ---------------------------------------------------------------------------------------------
# [scope] — operationId → the token scope it really needs
# ---------------------------------------------------------------------------------------------
#
# Derived from `tags[0]` plus the HTTP method (GET/HEAD → `read:`, else `write:`), which is
# right for the overwhelming majority. Corrections go here so that the `InsufficientScope`
# error message can tell the user which scope to create a new token with — and Gitea scopes
# are fixed at creation, so getting this wrong costs the user a round trip through the web UI.
[scope]

